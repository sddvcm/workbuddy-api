name: 功能建议
description: 提一个新功能或改进想法
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        先搜一下 issue 列表，可能已经有人提过。
        与「要不要支持某个新平台」相关的建议，请附上该平台的免费额度获取方式——
        这决定了实现的优先级。

  - type: textarea
    id: problem
    attributes:
      label: 想解决什么问题
      description: 描述场景与痛点，不要直接描述你设想的解法
      placeholder: |
        我有 20 个 Kilo 账号，每次手动点「测试连通」要逐个来……
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: 期望的行为
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 考虑过的替代方案
      description: 有没有现成的绕法？为什么不够好？

  - type: dropdown
    id: scope
    attributes:
      label: 影响面
      options:
        - 新增渠道 / 平台
        - 账号池调度
        - 面板 UI
        - 网关协议（OpenAI / Anthropic / Gemini）
        - 签到 / 任务 / 补偿等批量操作
        - 部署 / Docker
        - 其他
