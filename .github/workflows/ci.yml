name: CI

# 每个 PR 与 main 的每次推送都跑。目的：把「本地三道关」搬到线上，
# 让评审人不用先问「你本地跑过吗」。
on:
  pull_request:
  push:
    branches: [main]

jobs:
  go:
    name: Go 构建 / vet / 测试
    runs-on: ubuntu-latest
    env:
      # 到期预警类测试（internal/stats/views_test.go）把绝对时刻写成 +08:00，
      # 基准却用 time.Local —— 即**假定运行环境是东八区**。GitHub runner 默认 UTC，
      # 不设这个变量则 HoursLeft 恒差 8 小时、BurnForecast 算错（实测
      # `soon 剩余 = 2.0h，want ≈10h`、`forecast = 750, want 830`）。
      # Unix 下 Go 的 initLocal 优先读 $TZ，故在此固定；别改成"顺手删掉"。
      TZ: Asia/Shanghai
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
      # CGO_ENABLED=0：与本仓库 build.yml 的 windows 矩阵项一致，
      # 避免 runner 上缺 C 编译器导致 net 包解析器编译失败。
      - name: Build
        env:
          CGO_ENABLED: "0"
        run: go build ./...
      - name: Vet
        env:
          CGO_ENABLED: "0"
        run: go vet ./...
      # 实盘验证（internal/cline/live_test.go 等）默认不跑：它们带
      # `//go:build live` 标签且要真 Key，只在本地按需执行。
      - name: Test
        env:
          CGO_ENABLED: "0"
        run: go test ./...

  frontend:
    name: 前端静态检查
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # 20 已被 GitHub 标记 deprecated（会收到强制迁移警告），用 22
          node-version: '22'
      - name: 语法检查
        run: node --check cmd/workbuddy-api/web/app.js
      # 断言冷却标签/汇总条渲染正确，且顶层函数/常量不得重复定义
      # （曾出现 renderSummary 写了两版、前者成死代码，node --check 与功能测试都发现不了）
      - name: 静态检查
        run: node scripts/ui-static-check.mjs
